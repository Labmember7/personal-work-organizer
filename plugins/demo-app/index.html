<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="trk-plugin-id" content="demo-app" />
    <title>Démo app</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1rem;
        color: #222;
      }
      h3 {
        margin: 0 0 0.5rem;
      }
      button {
        margin-top: 0.75rem;
      }
    </style>
    <!-- Carte d'imports : permet `import trk from "trk:sdk"` (module servi
         par l'hôte à app-plugin://<id>/@trk/sdk.js). Doit précéder le script
         de module. -->
    <script type="importmap">
      { "imports": { "trk:sdk": "/@trk/sdk.js" } }
    </script>
  </head>
  <body>
    <h3 id="title">Chargement…</h3>
    <p id="count"></p>
    <button id="refresh" type="button">Rafraîchir</button>
    <script type="module" src="./main.js"></script>
  </body>
</html>
